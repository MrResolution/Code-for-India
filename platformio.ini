; Needs DOGU_AP_SSID / DOGU_AP_PASSWORD in include/secrets.h. See docs/DOGU.md
; Flash:   pio run -e dogu -t upload
; ─────────────────────────────────────────────────────────────────────────────
[env:dogu]
platform = espressif32
board = nodemcu-32s
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
