; PlatformIO Project Configuration File
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-CAM  Grayscale UDP SLAM Streamer  (AI Thinker ESP32-CAM)
; Flash:   pio run -e esp32cam_slam -t upload
; Monitor: pio device monitor -e esp32cam_slam
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32cam_slam]
platform = espressif32
board = esp32cam
framework = arduino
; huge_app partition is required to fit camera driver + WiFi stack
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed  = 921600
upload_port   = /dev/ttyUSB0
monitor_port  = /dev/ttyUSB0
lib_deps =
    pololu/VL53L1X @ ^1.3.1
build_src_filter = -<*> +<esp32cam_grayscale_udp.cpp>


[env:nodemcu-32s]
